<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14161e">
  <title>Author · 节点画布</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/canvas.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z M3 12l9 5 9-5 M3 16l9 5 9-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-node" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 10h8m-8 4h5"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="m5 3 14 10-7 1-3 7L5 3Z"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v5c0 4-2 7-6 7h-1c-3 0-4-2-6-4l-3-4a1.6 1.6 0 0 1 2-2l2 2Z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  </svg>
  <header class="topbar">
    <div class="brand"><span class="brand-icon"><svg><use href="#i-logo"/></svg></span>Author</div>
    <div class="breadcrumb"><a href="/narrative">叙述层</a><svg><use href="#i-chevron"/></svg><strong>节点画布</strong></div>
    <button id="quick-add" class="primary" disabled><svg><use href="#i-plus"/></svg>添加节点</button>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <section class="library">
        <div class="eyebrow">LIBRARY</div>
        <h1>节点库</h1>
        <p>选择类型，在画布上放置节点。</p>
        <div id="palette" class="palette"></div>
      </section>
      <section class="node-list-section">
        <h2>画布节点 <span id="node-count">0</span></h2>
        <div id="node-list" class="node-list"></div>
      </section>
    </aside>
    <section id="canvas" class="canvas" aria-label="网格画布">
      <div id="world" class="world"></div>
      <div class="canvas-label"><span></span> 节点画布</div>
      <div id="empty" class="empty" hidden>
        <svg class="empty-art" viewBox="0 0 244 132" fill="none" aria-hidden="true">
          <defs><linearGradient id="card-fill" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#2a2544"/><stop offset="1" stop-color="#1b1b2a"/>
          </linearGradient></defs>
          <path d="M50 63h37m70 0h37" stroke="#5a4c84" stroke-dasharray="3 5"/>
          <rect x="14" y="48" width="47" height="38" rx="8" fill="#1b1d28" stroke="#393649"/>
          <path d="M25 61h24m-24 10h14" stroke="#676078" stroke-linecap="round"/>
          <rect x="183" y="48" width="47" height="38" rx="8" fill="#1b1d28" stroke="#393649"/>
          <path d="M194 61h24m-24 10h14" stroke="#676078" stroke-linecap="round"/>
          <rect x="80" y="26" width="84" height="80" rx="20" fill="#a894ff" fill-opacity=".04" stroke="#a894ff" stroke-opacity=".15"/>
          <rect x="88" y="34" width="68" height="64" rx="14" fill="url(#card-fill)" stroke="#8066dc"/>
          <path d="M122 54v24m-12-12h24" stroke="#c6b6ff" stroke-width="2" stroke-linecap="round"/>
          <circle cx="67" cy="28" r="2" fill="#7c66c5"/><circle cx="177" cy="105" r="2" fill="#7c66c5"/>
        </svg>
        <h2>从一个节点开始</h2>
        <p>双击画布任意位置，或从节点库选择类型。</p>
      </div>
      <div id="placement" class="placement" hidden>点击画布放置节点 <kbd>Esc</kbd> 取消</div>
      <div class="canvas-tools">
        <div class="tool-group">
          <button id="select" class="icon-button" title="选择" aria-label="选择" aria-pressed="true"><svg><use href="#i-pointer"/></svg></button>
          <button id="pan" class="icon-button" title="平移（按住空格）" aria-label="平移" aria-pressed="false"><svg><use href="#i-hand"/></svg></button>
        </div>
        <div class="tool-group">
          <button id="zoom-out" class="icon-button" title="缩小" aria-label="缩小"><svg><use href="#i-minus"/></svg></button>
          <output id="zoom">100%</output>
          <button id="zoom-in" class="icon-button" title="放大" aria-label="放大"><svg><use href="#i-plus"/></svg></button>
          <span class="divider"></span>
          <button id="reset" class="icon-button" title="回到原点并重置缩放" aria-label="重置视图"><svg><use href="#i-home"/></svg></button>
        </div>
      </div>
    </section>
  </main>
  <footer class="statusbar">
    <div id="status" class="save-status" role="status"><span></span><span id="status-text">正在加载</span></div>
    <div class="shortcuts"><span><kbd>空格</kbd> 拖动平移</span><span>滚轮缩放</span><span><kbd>双击</kbd> 添加或改名</span></div>
  </footer>
</body>
</html>
